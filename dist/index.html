<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸上 · 试卷练习台</title><link rel="stylesheet" href="style.css"><body><header><a class="brand">▱ <b>纸上</b><small>PAPERLY</small></a><nav>我的练习台 <span>本地处理 · 安心书写</span></nav><button id="import" class="primary">＋ 导入试卷</button><button id="export">↗ 导出答卷</button></header><main><aside><div class="label">练习文件 <span id="count">01</span></div><button id="add">＋ 添加 PDF / 图片</button><div id="pages"></div><p class="privacy">● 答题内容自动保存在此浏览器<br>图片与 PDF 无需上传</p></aside><section class="workspace"><div class="heading"><div><small>YOUR QUIET STUDY SPACE</small><h1>让每一份试卷，都能落笔。</h1><p>打开试卷，专注思考。像在纸上一样自由作答。</p></div><div class="motto">✦ 今天也在一点点进步<br><small>专注于当下这一题</small></div></div><div class="document-bar"><b id="docname">一年级数学 · 单元练习</b><span class="tag">练习中</span><div class="zoom"><button id="minus">−</button><span id="zoom">100%</span><button id="plus">＋</button><button id="fit">适应宽度</button></div></div><div class="desk" id="desk"><div class="paper" id="paper"><canvas id="base"></canvas><canvas id="ink"></canvas></div></div><footer><span id="status">✓ 已就绪 · 选一支笔，开始答题吧</span><span id="pageinfo"></span><span>空格拖动画布 · Ctrl Z 撤销</span></footer></section><section class="tools"><div class="label">书写工具</div><div id="toolset"><button data-tool="pen" class="selected">✎<small>画笔</small></button><button data-tool="highlight">▰<small>荧光笔</small></button><button data-tool="eraser">▱<small>橡皮</small></button><button data-tool="text">T<small>文字</small></button><button data-tool="line">╱<small>直线</small></button><button data-tool="rect">▢<small>矩形</small></button><button data-tool="circle">◯<small>圆形</small></button><button data-tool="hand">✥<small>移动</small></button></div><div class="label">墨水颜色</div><div id="colors"></div><div class="label">笔画粗细 <span id="sizeval">3</span></div><input id="size" type="range" min="1" max="30" value="3" aria-label="笔画粗细"><div class="stroke"><span id="stroke"></span></div><div class="actions"><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="clear">⌫ 清空本页</button></div><div class="tip">像纸一样，<br>多一点可能。<p>支持鼠标、触屏与手写笔，灵感和答案都留在这里。</p></div></section></main><input hidden id="files" type="file" multiple accept="application/pdf,image/*"><div id="toast" role="status"></div><dialog id="exportDialog"><h2>把努力保存下来</h2><p>导出包含你的全部书写内容。</p><button id="png">当前页 PNG</button><button id="pdf">全部页面 PDF</button><button id="closeDialog">取消</button></dialog><script src="assets/pdf.min.js"></script><script src="assets/jspdf.min.js"></script><script src="app.js"></script></body></html>
